<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NEXORA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{--bg:#050505;--gold:#f6b81c;--gold2:#ffd96b;--ember:#ff5a1f;--ink:#f4ecd8;--mute:#9a917d;--panel:rgba(18,14,6,.8);--line:rgba(246,184,28,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root:not([data-theme="light"]){--bg:#050505}
*{box-sizing:border-box}
html{font-size:clamp(10px,2.6vmin,20px);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Tajawal","Rajdhani",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.scr.on{opacity:1;pointer-events:auto}
.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;background:radial-gradient(ellipse at 50% 35%,#2b1a05 0,#050505 62%);overflow:auto}
img.logo{display:block;mix-blend-mode:screen;width:min(80vw,62vh*1.78);height:auto}
#splash img.logo{animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
svg.wave{width:min(70vw,36rem);height:6rem;display:block;overflow:visible}
#pct{font:700 1.6rem Rajdhani;color:var(--gold);letter-spacing:.1em}
#bar{height:3px;width:0;background:linear-gradient(90deg,var(--ember),var(--gold2));box-shadow:0 0 10px var(--ember)}
.barw{width:min(70vw,36rem);height:3px;background:rgba(255,255,255,.1)}
.row{flex-direction:column}
@media (orientation:landscape){.row{flex-direction:row;gap:4rem}.row img.logo{width:min(44vw,50vh*1.78)}}
.card{width:min(90vw,40rem);background:var(--panel);border:1px solid var(--line);border-radius:1.6rem;padding:2rem;direction:rtl;text-align:center;backdrop-filter:blur(6px)}
.card h2{margin:0 0 .4rem;font:700 2.4rem Rajdhani;color:var(--gold);letter-spacing:.06em;text-align:left}
.card svg.wave{width:100%;height:5rem;margin:.6rem 0}
.sso{display:flex;align-items:center;justify-content:center;gap:1.2rem;width:100%;height:4.8rem;border-radius:1.2rem;font-weight:700;font-size:1.6rem;margin-top:1rem;transition:transform .15s}
.sso:active{transform:scale(.98)}.sso svg{width:2.4rem;height:2.4rem}
.sso.g{background:#fff;color:#1f1f1f}.sso.f{background:#1877f2;color:#fff}
.sso[disabled]{opacity:.6}
.fine{margin:1.4rem 0 0;font-size:1.15rem;color:var(--mute);line-height:1.7}
.out{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1.2rem;font-size:1.5rem;color:var(--ink)}
.out svg{width:2.2rem;height:2.2rem}
/* lobby */
#lobby{background:radial-gradient(ellipse at 50% 72%,#3d2706 0,#150e04 46%,#030303 82%)}
#lobby::before{content:"";position:absolute;left:0;right:0;top:36%;height:2px;background:linear-gradient(90deg,transparent,var(--ember),transparent);opacity:.45;box-shadow:0 0 22px var(--ember)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none;padding:1rem calc(1rem + env(safe-area-inset-left,0px))}
.pe{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
.prof{display:flex;align-items:center;gap:.8rem;background:var(--panel);border:1px solid var(--line);padding:.5rem 1.2rem .5rem .5rem;border-radius:.8rem}
.av{width:4rem;height:4rem;border-radius:.6rem;background:linear-gradient(135deg,var(--gold),#a86400);color:#1a1000;display:grid;place-items:center;font:700 2.2rem Rajdhani}
.prof b{display:block;font:700 1.5rem Rajdhani;max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof small{font:600 1.1rem Rajdhani;color:var(--mute)}
.xp{display:block;width:9rem;height:.4rem;background:rgba(255,255,255,.14);margin-top:.3rem}.xp u{display:block;width:12%;height:100%;background:var(--gold)}
.cur{display:flex;gap:.8rem}
.pill{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:2rem;padding:.4rem .5rem .4rem 1rem;font:700 1.5rem Rajdhani;min-width:8rem;justify-content:space-between}
.pill em{font-style:normal;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--gold);color:#1a1000;display:grid;place-items:center;font-size:1.6rem}
.coin{width:1.8rem;height:1.8rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a00);display:inline-block}
.gem{width:1.5rem;height:1.5rem;background:linear-gradient(135deg,#ff9a5a,#ff3d1f);transform:rotate(45deg);display:inline-block}
.tools{display:flex;gap:.6rem}
.ib{width:3.8rem;height:3.8rem;border-radius:.8rem;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold2)}
.ib svg{width:2.2rem;height:2.2rem}
.menu{position:absolute;left:calc(1rem + env(safe-area-inset-left,0px));top:7.6rem;width:17rem;display:flex;flex-direction:column;gap:.5rem}
.mi{display:flex;align-items:center;gap:.9rem;height:3.7rem;padding:0 1.4rem 0 1rem;background:var(--panel);border-left:.35rem solid var(--gold);clip-path:polygon(0 0,100% 0,calc(100% - .9rem) 100%,0 100%);font-weight:700;font-size:1.45rem;text-align:left;direction:rtl;justify-content:flex-end}
.mi::before{content:"";width:.8rem;height:.8rem;background:var(--gold);transform:rotate(45deg);order:2}
.mi.skin{height:5.6rem;background:linear-gradient(100deg,#5a2d00,#1a1204);flex-direction:column;align-items:flex-end;justify-content:center;gap:.2rem;font-size:1.3rem}.mi.skin::before{display:none}
.mi.skin small{color:var(--gold2);font:700 1.1rem Rajdhani}
.side{position:absolute;right:calc(1rem + env(safe-area-inset-right,0px));top:7.6rem;width:19rem;display:flex;flex-direction:column;gap:.7rem}
.rk,.mode{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.9rem 1.1rem;direction:rtl}
.rk h4{margin:0 0 .6rem;font-size:1.2rem;color:var(--gold2)}
.rk .r{display:flex;align-items:center;gap:1rem}
.hex{width:4rem;height:4.6rem;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#d4893a,#7a4a1c);display:grid;place-items:center;font:700 1.8rem Rajdhani;color:#fff}
.rk b{font-size:1.5rem}.rk small{display:block;font:600 1.1rem Rajdhani;color:var(--mute);margin-top:.3rem}
.rk .pb{height:.4rem;background:rgba(255,255,255,.14);margin-top:.4rem}.rk .pb u{display:block;width:72%;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold))}
.mode b{display:block;font-size:1.4rem}.mode small{color:var(--mute);font-size:1.15rem}
.nav{position:absolute;left:calc(1rem + env(safe-area-inset-left,0px));right:25rem;bottom:1rem;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;overflow:hidden}
.nav button{flex:1;height:4.6rem;font-weight:700;font-size:1.35rem;position:relative}
.nav button+button{border-left:1px solid rgba(246,184,28,.2)}
.nav button.dot::after{content:"";position:absolute;top:.8rem;right:1.2rem;width:.8rem;height:.8rem;border-radius:50%;background:#ff3030}
.play{position:absolute;right:calc(1rem + env(safe-area-inset-right,0px));bottom:1rem;width:22rem;height:6.4rem;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d98f00);color:#1a1000;font:800 3rem Tajawal;overflow:hidden}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
@media (orientation:portrait){
 .ib.opt{display:none}.cur{gap:.4rem}.pill{min-width:0;padding-left:.7rem}.prof b{max-width:7rem}.xp{width:6rem}
 .menu{width:13rem;top:8rem}.mi{font-size:1.2rem}.side{width:15rem;top:8rem}
 .nav{right:calc(1rem + env(safe-area-inset-right,0px));bottom:1rem}.nav button{font-size:1.05rem;height:4.4rem}
 .play{bottom:6.6rem;width:19rem}
}
#vault,#wpn{position:absolute;top:0;right:0;bottom:0;width:min(42rem,94vw);padding:calc(1rem + env(safe-area-inset-top,0px)) calc(1rem + env(safe-area-inset-right,0px)) calc(1rem + env(safe-area-inset-bottom,0px)) 1.2rem;background:linear-gradient(270deg,rgba(10,8,3,.97),rgba(10,8,3,.9));border-left:1px solid var(--line);transform:translateX(104%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:.9rem;direction:rtl;z-index:4}
#vault.on,#wpn.on{transform:none}
.its.wl{grid-template-columns:1fr}.ic.wc{text-align:right;padding:.9rem 1rem}
.wc b{display:block;font-size:1.5rem;font-family:Rajdhani,Tajawal,sans-serif;letter-spacing:.04em}.wc small{display:block;color:var(--mute);font-size:1.1rem;margin-top:.2rem}
.st{display:grid;grid-template-columns:7rem 1fr;gap:.45rem .7rem;align-items:center;font-size:1.1rem;color:var(--mute);margin-top:.7rem}
.bar{height:.5rem;background:rgba(255,255,255,.12);border-radius:.3rem}.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:.3rem}
.vh{display:flex;justify-content:space-between;align-items:center}.vh h3{margin:0;font-size:2.2rem;color:var(--gold)}
.vh button{width:3.6rem;height:3.6rem;border-radius:.8rem;border:1px solid var(--line);color:var(--gold2);display:grid;place-items:center}.vh svg{width:2rem;height:2rem}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.oc,.ic,.sb{position:relative;background:var(--panel);border:1px solid rgba(246,184,28,.25);border-radius:.9rem;font-weight:700}
.oc{text-align:right;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.5rem;font-size:1.35rem}
.oc span{display:flex;gap:.3rem}.oc i{width:1.3rem;height:1.3rem;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.oc.on,.ic.on,.sb.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(246,184,28,.13)}
.oc em,.ic em{position:absolute;top:.6rem;left:.7rem;font-style:normal;font-size:1rem;background:var(--gold);color:#1a1000;border-radius:1rem;padding:.1rem .7rem}
.vb{flex:1;min-height:0;display:flex;gap:.8rem}
.sl{width:9.5rem;flex:none;display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.sb{height:3.6rem;flex:none;font-size:1.3rem}
.its{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.7rem;align-content:start}
.ic{padding:.8rem;font-size:1.25rem;text-align:center}
.sw{aspect-ratio:1;border-radius:.7rem;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:.5rem}.sw u{width:55%;height:2px;background:#777;transform:rotate(-40deg)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:9rem;transform:translateX(-50%);background:rgba(20,16,6,.94);border:1px solid var(--line);padding:.9rem 1.8rem;border-radius:2rem;font-size:1.4rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;direction:rtl}
#toast.on{opacity:1}
/* Character test controls */
#charControls{position:absolute;inset:0;pointer-events:none;z-index:3}
#movePad{position:absolute;right:1.2rem;bottom:8.2rem;width:10rem;height:10rem;border:2px solid rgba(246,184,28,.55);border-radius:50%;background:rgba(10,8,4,.32);pointer-events:auto;touch-action:none;display:grid;place-items:center}
#moveKnob{width:3.8rem;height:3.8rem;border-radius:50%;background:linear-gradient(145deg,#ffe08a,#d98f00);box-shadow:0 0 18px #f6b81c88;pointer-events:none}
#actionBtns{position:absolute;left:1.2rem;bottom:8.2rem;display:flex;flex-direction:column;gap:.8rem;pointer-events:auto}
#actionBtns button{min-width:7rem;height:4.2rem;padding:0 .9rem;border-radius:1rem;border:1px solid var(--line);background:rgba(15,11,4,.88);color:var(--gold2);font-weight:800;box-shadow:0 4px 16px #0008;touch-action:manipulation}
#actionBtns button.active{background:linear-gradient(135deg,#f6b81c,#a45c00);color:#160e00}
#fireBtn{background:linear-gradient(135deg,#a72a12,#4b1009)!important;color:#fff!important;border-color:#ff7048!important}
@media (orientation:landscape){#movePad{right:2rem;bottom:2rem}#actionBtns{left:2rem;bottom:2rem}}

</style>
</head>
<body>
<section id="splash" class="scr ctr on">
  <img class="logo" alt="NEXORA">
  <div><svg class="wave" viewBox="0 0 360 100" preserveAspectRatio="none"></svg><div class="barw"><div id="bar"></div></div></div>
  <div id="pct">0%</div>
</section>

<section id="login" class="scr ctr row">
  <img class="logo" alt="NEXORA">
  <div class="card">
    <h2>NEXORA</h2>
    <svg class="wave" viewBox="0 0 360 100" preserveAspectRatio="none"></svg>
    <button class="sso g" data-p="تجريبي"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.86c2.26-2.08 3.58-5.15 3.58-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3a7.2 7.2 0 0 1-10.7-3.78H1.4v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.36 14.31a7.2 7.2 0 0 1 0-4.62V6.6H1.4a12 12 0 0 0 0 10.8l3.96-3.09z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43A11.95 11.95 0 0 0 12 0 12 12 0 0 0 1.4 6.6l3.96 3.09A7.15 7.15 0 0 1 12 4.75z"/></svg><span>دخول تجريبي</span></button>
    <button class="sso f" data-p="تجريبي"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#fff"/><path fill="#1877f2" d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-1 .4-1.7 1.8-1.7h1.6V3.8c-.3 0-1.3-.1-2.4-.1-2.5 0-4.1 1.5-4.1 4.2v2.6H7.6v3.3h2.8V22z"/></svg><span>دخول تجريبي بحساب آخر</span></button>
    <p class="fine">هذه نسخة تجريبية: الدخول ينشئ اسماً محلياً على هذا الجهاز فقط، ولا يتصل فعلياً بـ Google أو Facebook.</p>
  </div>
</section>

<section id="lobby" class="scr">
  <canvas id="cv"></canvas>
  <div id="charControls">
    <div id="movePad" aria-label="توجيه الشخصية"><div id="moveKnob"></div></div>
    <div id="actionBtns"><button id="runBtn">جري تلقائي</button><button id="fireBtn">إطلاق / بوكس</button></div>
  </div>
  <div class="ui">
    <div class="top">
      <div class="prof pe" data-soon><div class="av" id="av">N</div><div><b id="pname">NEXORA</b><small>Lv 1</small><i class="xp"><u></u></i></div></div>
      <div class="cur"><span class="pill pe" data-soon><s class="coin"></s>0<em>+</em></span><span class="pill pe" data-soon><s class="gem"></s>0<em>+</em></span></div>
      <div class="tools">
        <button class="ib opt pe" data-i="bell" data-soon></button><button class="ib opt pe" data-i="users" data-soon></button>
        <button class="ib pe" data-i="mail" data-soon></button><button class="ib pe" data-i="gear" id="gear"></button>
      </div>
    </div>
    <div class="menu pe">
      <button class="mi skin" data-soon>سكن جديد<small>NOVA</small></button>
      <button class="mi" data-soon>رحلة جديدة</button><button class="mi" data-soon>الحقيبة</button>
      <button class="mi" data-soon>المتجر</button><button class="mi" data-soon>باس الموسم</button><button class="mi" data-soon>الأحداث</button>
    </div>
    <div class="side">
      <div class="rk pe" data-soon><h4>باتل رويال · الموسم 1</h4><div class="r"><div class="hex">IV</div><div><b>برونزي IV</b><small>144 / 200</small></div></div><div class="pb"><u></u></div></div>
      <div class="mode pe" data-soon><b>باتل رويال · مصنّف</b><small>الوادي الصحراوي</small></div>
    </div>
    <div class="nav pe"><button data-soon>الشخصيات</button><button id="vbtn">الخزنة</button><button data-soon>المتصدرين</button><button class="dot" data-soon>التصنيف</button><button id="wbtn">الأسلحة</button></div>
    <button class="play pe" data-soon>العب</button>
  </div>
  <aside id="vault">
    <div class="vh"><h3>الخزنة</h3><button id="vx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="outs" id="outs"></div>
    <div class="vb"><div class="sl" id="sl"></div><div class="its" id="its"></div></div>
  </aside>
  <aside id="wpn">
    <div class="vh"><h3>الأسلحة</h3><button id="wx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="vb"><div class="sl" id="wsl"></div><div class="its wl" id="wits"></div></div>
  </aside>
  <div id="set" class="ov"><div class="card pe">
    <h2>NEXORA</h2>
    <svg class="wave" viewBox="0 0 360 100" preserveAspectRatio="none"></svg>
    <p class="fine" id="who"></p>
    <button class="out" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M10 12h10M16 8l4 4-4 4"/></svg><span>تسجيل الخروج</span></button>
  </div></div>
</section>
<div id="toast"></div>

let dragging=false,dx0=0;const cvs=$('#cv');

let moveX=0,moveY=0,autoRun=false,isFiring=false,fireUntil=0,moveMode='idle';
const movePad=$('#movePad'),moveKnob=$('#moveKnob'),runBtn=$('#runBtn'),fireBtn=$('#fireBtn');
let padPointer=null;
function setPad(e){const r=movePad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width*.36),y=(e.clientY-cy)/(r.height*.36);const d=Math.hypot(x,y)||1;if(d>1){x/=d;y/=d}moveX=x;moveY=y;moveKnob.style.transform=`translate(${x*24}px,${y*24}px)`;}
movePad.addEventListener('pointerdown',e=>{padPointer=e.pointerId;movePad.setPointerCapture(e.pointerId);setPad(e)});
movePad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)setPad(e)});
function resetPad(){padPointer=null;moveX=moveY=0;moveKnob.style.transform=''}
movePad.addEventListener('pointerup',resetPad);movePad.addEventListener('pointercancel',resetPad);
runBtn.addEventListener('click',()=>{autoRun=!autoRun;runBtn.classList.toggle('active',autoRun);runBtn.textContent=autoRun?'إيقاف الجري':'جري تلقائي'});
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();isFiring=true;fireUntil=performance.now()+250;fireBtn.classList.add('active')});
['pointerup','pointercancel','pointerleave'].forEach(ev=>fireBtn.addEventListener(ev,()=>{isFiring=false;fireBtn.classList.remove('active')}));
function idle(t){const moving=autoRun||Math.abs(moveX)+Math.abs(moveY)>.16;moveMode=isFiring?'fire':moving?(autoRun?'run':'walk'):'idle';
 const speed=moveMode==='run'?10:moveMode==='walk'?6:moveMode==='fire'?2:1.8,phase=t*speed;
 const stride=moving?Math.sin(phase):0,breath=Math.sin(t*2.1);
 body.position.y=(moving?Math.abs(Math.cos(phase))*.018:0)+breath*.009;
 body.rotation.z=moveX*.055;body.rotation.x=moveY*.035;
 arms.forEach((a,i)=>{const side=i?1:-1;a.rotation.z=moving?side*(.12+stride*.24):(isFiring?side*.34:side*(.10+breath*.018));a.rotation.x=isFiring?-.42: moving?Math.cos(phase)*.12:0;});
 elbows.forEach((e,i)=>{e.rotation.x=isFiring?-.62:moving?-.25-Math.max(0,Math.sin(phase))*.22:-.12;});
 legs.forEach((l,i)=>{const side=i?1:-1;l.rotation.z=moving?side*stride*(moveMode==='run'?.38:.22):0;l.rotation.x=moving?Math.max(0,Math.cos(phase))*(moveMode==='run'?.28:.14):0;});
 knees.forEach((k,i)=>k.rotation.x=moving?Math.max(0,-Math.cos(phase))*(moveMode==='run'?.55:.3):0);
 if(moving){player.rotation.y+=(Math.atan2(moveX,-moveY||.001)-player.rotation.y)*.08;}
 if(isFiring){body.rotation.y=Math.sin(t*55)*.018;}
}
